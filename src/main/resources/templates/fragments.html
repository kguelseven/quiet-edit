<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- No layout dialect: plain fragments keep the dependency list at one starter. -->
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|quietedit - ${title}|">quietedit</title>
    <link rel="stylesheet" th:href="@{/quietedit.css}">
</head>
<body>

<!-- The space between two segments is template text outside the span, so a highlight never covers it. -->
<span th:fragment="marked(segments)" class="marked"
    ><th:block th:each="segment,i : ${segments}"
        ><th:block th:unless="${i.first}"> </th:block
        ><span th:if="${segment.marked}" class="mark" th:text="${segment.text}"></span
        ><th:block th:unless="${segment.marked}" th:text="${segment.text}"></th:block
    ></th:block
></span>

<!-- Named once, here: a local time without its zone is only readable by whoever chose it. -->
<header th:fragment="masthead" class="masthead">
    <a class="wordmark" th:href="@{/}">quietedit</a>
    <span class="tagline">silent edits to news articles</span>
    <span class="zone muted" th:text="|times in ${@timestamps.zone()}|">times in UTC</span>
</header>

</body>
</html>
