spring:
  application:
    name: quietedit
  datasource:
    url: ${QUIETEDIT_DB_URL:jdbc:postgresql://localhost:55432/quietedit}
    username: ${QUIETEDIT_DB_USER:quietedit}
    password: ${QUIETEDIT_DB_PASSWORD:quietedit}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never touch DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mvc:
    # RFC 7807 for every error response; stack traces never leave the process.
    problemdetails:
      enabled: true

quietedit:
  ingest:
    schedule:
      # The timer only calls runOnce(); the same run is reachable via POST /api/ingest/run.
      enabled: ${QUIETEDIT_SCHEDULE_ENABLED:true}
      # Fixed delay, measured from the end of the previous run.
      interval: ${QUIETEDIT_SCHEDULE_INTERVAL:5m}
    run:
      # Ceiling on the articles one run may fetch. Nothing above it is lost: the
      # next run takes the least recently fetched candidates first.
      max-articles: ${QUIETEDIT_MAX_ARTICLES_PER_RUN:100}
    recheck:
      # When a known article is fetched again. The curve is one number: re-check
      # after this fraction of the article's age, so attention decays the way a
      # newsroom's does. The reasoning is in RecheckPolicy.
      age-factor: 0.25
      min-interval: 10m
      max-interval: 12h
      # A stable article is watched this long after the last thing that happened
      # to it; every observed edit buys another window, up to max-window-factor.
      observation-window: 7d
      max-window-factor: 4
      # The only setting that can refuse work the curve generates.
      max-requests-per-host-per-hour: ${QUIETEDIT_MAX_HOST_REQUESTS_PER_HOUR:120}
      # How many of a feed's 'updated' claims may lead to no revision in a row
      # before the feed stops being believed and its entries go back on the curve.
      # One confirmed claim clears the count.
      max-unconfirmed-updated-claims: 20
      # Not a policy number: how many stored documents one run reads back to ask
      # the policy about, most overdue first.
      max-candidates-per-run: 500
    catalog:
      location: ${QUIETEDIT_FEEDS_FILE:file:./feeds.yaml}
    fetch:
      connect-timeout: 5s
      request-timeout: 15s
      # Per host, not per feed: several feeds can share one origin.
      min-host-interval: 1s
      # Counts the first try, so this is one try plus two retries.
      max-attempts: 3
      initial-backoff: 500ms
      backoff-multiplier: 2
    article:
      # Article requests reuse the fetch timeouts, retry budget and host interval
      # above; only these limits are article-specific.
      max-redirects: 5
      max-body-size: 8MB
      robots-cache-ttl: 1h
      # Shorter, so an unreadable robots.txt does not block a host for an hour.
      robots-failure-cache-ttl: 5m
      # Ceiling for a robots.txt Crawl-delay, so one host cannot stall a run.
      max-crawl-delay: 30s
      # Raw HTML lives outside the database; only the ref is persisted.
      storage-root: ${QUIETEDIT_RAW_HTML_DIR:./data/raw-html}

server:
  port: ${QUIETEDIT_PORT:8080}

logging:
  level:
    org.korhan.quietedit: DEBUG
    org.korhan.quietedit.ingest.FeedFetchService: DEBUG
