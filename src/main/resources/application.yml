spring:
  application:
    name: quietedit
  datasource:
    url: ${QUIETEDIT_DB_URL:jdbc:postgresql://localhost:55432/quietedit}
    username: ${QUIETEDIT_DB_USER:quietedit}
    password: ${QUIETEDIT_DB_PASSWORD:quietedit}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never touch DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mvc:
    # RFC 7807 for every error response; stack traces never leave the process.
    problemdetails:
      enabled: true

quietedit:
  ingest:
    catalog:
      location: ${QUIETEDIT_FEEDS_FILE:file:./feeds.yaml}
    fetch:
      connect-timeout: 5s
      request-timeout: 15s
      # Per host, not per feed: several feeds can share one origin.
      min-host-interval: 2s
      # Counts the first try, so this is one try plus two retries.
      max-attempts: 3
      initial-backoff: 500ms
      backoff-multiplier: 2
    article:
      # Article requests reuse the fetch timeouts, retry budget and host interval
      # above; only these limits are article-specific.
      max-redirects: 5
      max-body-size: 8MB
      robots-cache-ttl: 1h
      # Shorter, so an unreadable robots.txt does not block a host for an hour.
      robots-failure-cache-ttl: 5m
      # Ceiling for a robots.txt Crawl-delay, so one host cannot stall a run.
      max-crawl-delay: 30s
      # Raw HTML lives outside the database; only the ref is persisted.
      storage-root: ${QUIETEDIT_RAW_HTML_DIR:./data/raw-html}

server:
  port: ${QUIETEDIT_PORT:8080}

logging:
  level:
    org.korhan.quietedit: INFO
