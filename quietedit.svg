<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img">
<title>quietedit</title>
<desc>A rounded square containing three text lines, where the middle line is duplicated and offset to show a silent change.</desc>
<style>
.qe-frame{fill:none;stroke:#1c1b19;stroke-width:6}
.qe-bar{fill:#c9c5bd}
.qe-ghost{fill:#c9c5bd;opacity:.45}
.qe-edit{fill:#c1502e}
.qe-word{fill:#1c1b19;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:40px;font-weight:500;letter-spacing:-.5px}
@media (prefers-color-scheme:dark){
.qe-frame{stroke:#f0ede6}
.qe-word{fill:#f0ede6}
.qe-bar{fill:#57534c}
.qe-ghost{fill:#57534c}
.qe-edit{fill:#e0714b}
}
</style>
<rect class="qe-frame" x="43" y="43" width="114" height="114" rx="26"/>
<rect class="qe-bar" x="70" y="72" width="60" height="9" rx="4.5"/>
<rect class="qe-ghost" x="70" y="94" width="44" height="9" rx="4.5"/>
<rect class="qe-edit" x="79" y="94" width="51" height="9" rx="4.5"/>
<rect class="qe-bar" x="70" y="116" width="60" height="9" rx="4.5"/>
<text class="qe-word" x="192" y="113">quietedit</text>
</svg>
